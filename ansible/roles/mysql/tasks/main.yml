- name: Install MySQL server
  apt:
    name:
      - mysql-server
      - python3-mysqldb
    state: present
    
- name: Start and enable MySQL
  systemd:
    name: mysql
    state: started
    enabled: yes

- name: Set MySQL root password
  shell: |
    sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '{{ mysql_root_password }}';"
  ignore_errors: yes

- name: Create databases and users
  shell: |
    mysql -u root -p'{{ mysql_root_password }}' -e "
    CREATE DATABASE IF NOT EXISTS grafana;
    CREATE DATABASE IF NOT EXISTS dive_logs;
    CREATE DATABASE IF NOT EXISTS bluewater_internal;
    CREATE USER IF NOT EXISTS 'grafana_user'@'localhost' IDENTIFIED BY '{{ grafana_db_password }}';
    CREATE USER IF NOT EXISTS 'portal_user'@'localhost' IDENTIFIED BY '{{ portal_db_password }}';"
  ignore_errors: yes
  
- name: Create dive_logs tables
  shell: |
    mysql -u root -p'{{ mysql_root_password }}' dive_logs -e "
    CREATE TABLE IF NOT EXISTS dive_records (
      id INT AUTO_INCREMENT PRIMARY KEY,
      dive_id INT,
      diver_name VARCHAR(100),
      certification VARCHAR(10),
      max_depth_m FLOAT,
      bottom_time_min INT,
      safety_stop_min INT,
      tank_start_bar INT,
      tank_end_bar INT,
      incident_flag TINYINT(1),
      incident_notes TEXT,
      date DATE
    );
    CREATE TABLE IF NOT EXISTS dive_summary (
      id INT AUTO_INCREMENT PRIMARY KEY,
      dive_id INT,
      divemaster_name VARCHAR(100),
      num_customers INT,
      incident_flag TINYINT(1),
      date DATE
    );"
  ignore_errors: yes
  
