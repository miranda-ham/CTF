# INTENTIONAL: bluewater_internal contains real incident records
# dive_logs contains falsified versions with incidents scrubbed
# This contrast is what sync_logs.py exploits to produce the root flag
# Do NOT sync or modify bluewater_internal data


- name: Populate staff table
  shell: |
    mysql -u root -p'{{ mysql_root_password }}' bluewater_internal -e "
    INSERT IGNORE INTO staff (username, password, role, ssh_password) VALUES
    ('admin', 'BlueWater2023!', 'manager', NULL),
    ('{{ divemaster_name }}', '{{ divemaster_password }}', 'divemaster', '{{ divemaster_password }}'),
    ('intern', 'intern2024', 'intern', NULL);"
  ignore_errors: yes
# INTENTIONAL: staff table stores divemaster SSH password in plaintext
# This is recovered via SQL injection on port 8080 (CWE-89)
# Do NOT hash the ssh_password column

- name: Grant DB permissions
  shell: |
    mysql -u root -p'{{ mysql_root_password }}' -e "
    GRANT ALL PRIVILEGES ON grafana.* TO 'grafana_user'@'localhost';
    GRANT SELECT ON dive_logs.* TO 'grafana_user'@'localhost';
    GRANT ALL PRIVILEGES ON dive_logs.* TO 'portal_user'@'localhost';
    GRANT ALL PRIVILEGES ON bluewater_internal.* TO 'portal_user'@'localhost';
    FLUSH PRIVILEGES;"
  
- name: Pin MySQL version to prevent auto-upgrade
  shell: apt-mark hold mysql-server
  ignore_errors: yes
