- name: Install mysql-connector-python
  pip:
    name: mysql-connector-python
    executable: pip3
    
- name: Create log directory
  file:
    path: /var/log/bluewater/
    state: directory
    owner: root
    group: divemaster
    mode: '0750'
    
- name: Sync logs.py
  template:
    src: sync_logs.py.j2
    dest: /opt/sync_logs.py
    owner: root
    group: root
    mode: '0777'
  # Do NOT change permissions to 0755 or 0700
  # Do NOT change owner away from root
  
- name: Create sync cron job
  cron:
    name: "BlueWater dive log sync"
    minute: "*/5"
    job: "python3 /opt/sync_logs.py"
    user: root
  # Do NOT change user to www-data or divemaster
  
- name: Create user flag
  copy:
    dest: "/home/{{divemaster_name}}/user.txt"
    content: "{{user_flag}}"
    owner: "{{divemaster_name}}"
    group: "{{divemaster_name}}"
    mode: '0600'
    
- name: Create root flag file
  copy:
    dest: /root/flag.txt
    content: "{{ root_flag }}\n"
    owner: root
    group: root
    mode: '0400'
    
- name: Flush existing auditd rules
  shell: auditctl -D
  ignore_errors: yes

- name: Configure auditd rules for CTF logging
  copy:
    dest: /etc/audit/rules.d/bluewater.rules
    content: |
      # Monitor writes to world-writable cron script (privilege escalation step)
      -w /opt/sync_logs.py -p wa -k cron_script_modified
      -w /opt/sync_logs.py -p x -k cron_script_executed
      -w /home/divemaster/user.txt -p r -k flag_read
      -w /root/flag.txt -p r -k root_flag_read
      -w /var/log/auth.log -p r -k auth_log_read
      -a always,exit -F arch=b64 -S execve -F euid=33 -k webshell_exec
    owner: root
    group: root
    mode: '0640'

- name: Load auditd rules directly
  shell: |
    auditctl -w /opt/sync_logs.py -p wa -k cron_script_modified
    auditctl -w /opt/sync_logs.py -p x -k cron_script_executed
    auditctl -w /home/divemaster/user.txt -p r -k flag_read
    auditctl -w /root/flag.txt -p r -k root_flag_read
    auditctl -w /var/log/auth.log -p r -k auth_log_read
    auditctl -a always,exit -F arch=b64 -S execve -F euid=33 -k webshell_exec
    
- name: Create systemd override directory for auditd
  file:
    path: /etc/systemd/system/auditd.service.d
    state: directory
    mode: '0755'

- name: Deploy auditd systemd override for ProtectHome and rule reload
  copy:
    dest: /etc/systemd/system/auditd.service.d/override.conf
    content: |
      [Service]
      ProtectHome=read-only
      ExecStartPost=-/sbin/auditctl -D
      ExecStartPost=-/sbin/auditctl -R /etc/audit/rules.d/bluewater.rules
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd and restart auditd

