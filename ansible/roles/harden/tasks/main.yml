- name: Install UFW
  apt:
    name: ufw
    state: present
    
- name: Set UFW defaults (deny inbound, allow outbound)
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    
- name: Allow SSH through firewall
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow HTTP through firewall
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow staff portal through firewall
  community.general.ufw:
    rule: allow
    port: '8080'
    proto: tcp
    
- name: Enable UFW
  community.general.ufw:
    state: enabled
    
- name: Disable root SSH login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: restart sshd
  
- name: Remove cloud-init SSH config (blocks password auth)
  file:
    path: /etc/ssh/sshd_config.d/60-cloudimg-settings.conf
    state: absent
  notify: restart sshd
  
- name: Keep password authentication enabled (required for divemaster)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication yes'
  notify: restart sshd
  # INTENTIONAL: password auth required for divemaster SSH login
  # Credentials recovered via SQL injection on port 8080
  # Do NOT disable password authentication or switch to key-only auth
